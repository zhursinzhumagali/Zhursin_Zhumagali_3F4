<!DOCTYPE html>

<html lang="ru" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asimus</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="m-0 p-0 font-sans min-h-screen relative">

    <div class="container mx-auto">
        <div
            class="header w-full z-50 bg-white flex justify-between items-center gap-5 px-6 py-4 border-b border-gray-300">

            <div class="left-logo-side flex items-center">
                <img src="./images/logo-asimus.png" alt="" class="w-12">
                <h3 class="text-blue-700 text-xl">Asimus</h3>
            </div>
        </div>
        <main class="mt-5 px-9 flex justify-between items-center">

            <a href="./index.html" class="text-gray-500 hover:text-blue-700 flex items-center gap-1">
                <div class="w-4 h-4 shrink-0 bg-gray-500 hover:bg-blue-700" style="
                    mask-image: url('./images/home.png');
                    mask-size: contain;
                    mask-repeat: no-repeat;
                    mask-position: center;
                    -webkit-mask-image: url('./images/home.png');
                    -webkit-mask-size: contain;
                    -webkit-mask-repeat: no-repeat;
                    -webkit-mask-position: center;
                "></div>

                Back to home
            </a>
        </main>

        <div class="cont flex flex-col justify-center items-center">
            <form id="registerForm" class="flex flex-col justify-center mt-7 items-center rounded-xl w-95 p-7">
                <span class="text-gray-500">
                    <strong class="text-2xl text-black">Регистрация</strong> <br>
                    Создайте аккаунт, что бы продолжить
                </span>
                <div class="flex flex-col mt-7">
                    <input type="text" id="name" placeholder="Введите ваше имя"
                        class="border-2 p-2 w-72 rounded-lg text-base border-gray-400">
                </div>
                <div class="flex flex-col mt-3">
                    <input type="text" id=email placeholder="Введите ваш email"
                        class="border-2 p-2 w-72 rounded-lg text-base border-gray-400">
                </div>
                <div
                    class="flex mt-3 justify-between items-center border-2 p-2 w-72 rounded-lg border-gray-400 hover:border-blue-700">
                    <input type="password" id="password" placeholder="Введите пароль"
                        class="outline-none rounded-lg text-base">
                    <img src="./images/free-icon-hide.png" alt="" id="hide" class="w-5">
                </div>
                <button type="submit"
                    class="mt-5 bg-blue-500 text-white text-center p-3 w-72 rounded-lg hover:bg-blue-600 transition">
                    Зарегистрироваться
                </button>
                <hr class="w-72 border-t border-gray-300 my-5">
                <div class="center">
                    <span class="text-sm flex gap-2 text-gray-600">Уже есть аккаунт? <a href="./login.html"
                            class="text-blue-500">Войти</a>
                    </span>
                </div>
            </form>
        </div>

    </div>
</body>
<script src="./register.js"></script>

</html>
